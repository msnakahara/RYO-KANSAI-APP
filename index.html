<style>

  --accent:#4CAF8C;

body{margin:0;}

.tab{

}
.tab.active{color:#F3EFE4; border-bottom-color:#E8B93D;}
.wrap{padding:16px;}
.card{

label.field{display:block; font-size:12px; color:var(--ink-soft); font-weight:700; margin:0 0 5px;}
select,input[type=text],input[type=date],textarea{

textarea{resize:vertical; min-height:70px;}

.progress-track{

.progress-seg{height:100%;}

.dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

.rate-btn.sel-ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok-ink);}
.rate-btn.sel-warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn-ink);}

.hist-top{display:flex; justify-content:space-between; align-items:center;}
.hist-dorm{font-size:14px; font-weight:700;}

.detail-back{font-size:13px; color:var(--accent); font-weight:700; cursor:pointer; margin-bottom:10px; display:inline-block;}
.full-table{width:100%; border-collapse:collapse; font-size:12px; margin-top:6px;}
.full-table td{padding:7px 4px; border-bottom:1px solid var(--line);}
.full-table td.mark{width:28px; text-align:center; font-weight:700;}
.mark-good{color:var(--good);} .mark-ok{color:var(--ok);} .mark-warn{color:var(--warn);}

.confirm-mask{position:fixed; inset:0; background:rgba(20,20,15,.5); display:flex; align-items:flex-end; justify-content:center; z-index:80;}
.confirm-box{background:var(--surface); border-radius:18px 18px 0 0; padding:20px; width:100%; max-width:640px;}
.confirm-box p{font-size:14px; margin:0 0 16px;}
.confirm-actions{display:flex; gap:10px;}
.confirm-actions button{flex:1; padding:12px; border-radius:var(--radius-sm); font-size:14px; font-weight:700; cursor:pointer;}
.confirm-actions .yes{background:var(--danger); color:#fff; border:none;}
.confirm-actions .no{background:var(--surface-soft); color:var(--ink); border:1px solid var(--line-strong);}

.toast{
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  background:var(--accent-dark); color:#F3EFE4; padding:10px 18px; border-radius:20px;
  font-size:13px; z-index:90; opacity:0; pointer-events:none; transition:opacity .25s;
}
.toast.show{opacity:1;}
</style>

  ok:{icon:"〇", label:"普通", cls:"ok", score:70, en:"Fair", tl:"Katamtaman"},

};

  C:{en:"Needs Attention", tl:"Kailangan ng Pansin"},
  D:{en:"Needs Improvement", tl:"Kailangan ng Pagbabago"}
};
const PPTX_TXT = {
  headerTitle:"Regular Dormitory Inspection Report / Regular na Ulat ng Inspeksyon sa Dormitoryo",
  date:"Date / Petsa", inspector:"Inspector / Ang Nag-inspeksyon",
  overallComment:"Overall Comment / Pangkalahatang Komento",

const hasNativeStorage = (typeof window!=="undefined") && !!window.storage && typeof window.storage.set==="function";
let idbReady = null;
function openIDB(){
  if(idbReady) return idbReady;
  idbReady = new Promise((resolve,reject)=>{
    if(!("indexedDB" in window)){ reject(new Error("indexedDB not available")); return; }
    const req = indexedDB.open("dorm_audit_store", 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains("kv")) req.result.createObjectStore("kv"); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return idbReady;
}
const storageAPI = {
  async set(key, value){
    if(hasNativeStorage) return window.storage.set(key, value, false);
    const db = await openIDB();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("kv","readwrite");
      tx.objectStore("kv").put(value, key);
      tx.oncomplete = ()=> resolve({key, value, shared:false});
      tx.onerror = ()=> reject(tx.error);
    });
  },
  async get(key){
    if(hasNativeStorage) return window.storage.get(key, false);
    const db = await openIDB();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("kv","readonly");
      const req = tx.objectStore("kv").get(key);
      req.onsuccess = ()=> resolve(req.result===undefined? null : {key, value:req.result, shared:false});
      req.onerror = ()=> reject(req.error);
    });
  },
  async delete(key){
    if(hasNativeStorage) return window.storage.delete(key, false);
    const db = await openIDB();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("kv","readwrite");
      tx.objectStore("kv").delete(key);
      tx.oncomplete = ()=> resolve({key, deleted:true, shared:false});
      tx.onerror = ()=> reject(tx.error);
    });
  },
  async list(prefix){
    if(hasNativeStorage) return window.storage.list(prefix, false);
    const db = await openIDB();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("kv","readonly");
      const req = tx.objectStore("kv").getAllKeys();
      req.onsuccess = ()=>{
        const keys = req.result.map(k=>String(k)).filter(k=> !prefix || k.startsWith(prefix));
        resolve({keys, prefix, shared:false});
      };
      req.onerror = ()=> reject(req.error);
    });
  }
};

  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale);
        const h = Math.round(img.height*scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",0.68));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoInput(idx, fileList){
  const files = Array.from(fileList).slice(0,3);
  for(const f of files){
    try{
      const dataUrl = await compressImage(f);
      state.form.items[idx].photos.push(dataUrl);
    }catch(e){ console.error("photo compress error", e); }
  }
  render();
}

function computeStats(items){
  let good=0, ok=0, warn=0, rated=0, totalScore=0;
  items.forEach(it=>{
    if(it.rating){
      rated++;
      if(it.rating==="good") good++;
      if(it.rating==="ok") ok++;
      if(it.rating==="warn") warn++;
      totalScore += RATE_DEF[it.rating].score;
    }
  });
  const avg = rated? Math.round(totalScore/rated) : 0;
  let rank="D", rankLabel="要改善";
  if(avg>=90){rank="A"; rankLabel="非常に良好";}
  else if(avg>=75){rank="B"; rankLabel="良好";}
  else if(avg>=55){rank="C"; rankLabel="要注意";}
  else {rank="D"; rankLabel="要改善";}
  return {good, ok, warn, rated, total:items.length, avg, rank, rankLabel};
}

async function completeAudit(){
  const f = state.form;
  const stats = computeStats(f.items);
  if(!f.inspector.trim()){
    toast("実施者を選択してください");
    return;
  }
  if(stats.rated===0){
    toast("少なくとも1項目は評価してください");
    return;
  }
  const id = "a"+Date.now();
  const record = {
    id,
    date: f.date,
    inspector: f.inspector.trim(),
    dormName: f.dormName,
    items: f.items.map(it=>({ja:it.ja, en:it.en, tl:it.tl, rating:it.rating, photos:it.photos, note:it.note})),
    comment: f.comment.trim(),
    stats,
    createdAt: Date.now()
  };
  try{
    if(cloudEnabled){
      await db.collection(AUDITS_COLLECTION).doc(id).set(record);
    }else{
      await storageAPI.set("audit:"+id, JSON.stringify(record));
      const meta = {id, date:f.date, inspector:record.inspector, dormName:f.dormName, rank:stats.rank, rankLabel:stats.rankLabel, avg:stats.avg, warn:stats.warn, createdAt: record.createdAt};
      await storageAPI.set("meta:"+id, JSON.stringify(meta));
    }
    toast("監査結果を保存しました");
    state.detailId = id;
    state.view = "detail";
    state.form = freshForm();
    render();
  }catch(e){
    console.error("save error", e);
    toast("保存に失敗しました");
  }
}

let historyCache = null;
async function loadHistory(force){
  if(historyCache && !force) return historyCache;
  try{
    if(cloudEnabled){
      const snap = await db.collection(AUDITS_COLLECTION).orderBy("createdAt","desc").get();
      const metas = snap.docs.map(d=>{
        const v = d.data();
        return {id:d.id, date:v.date, inspector:v.inspector, dormName:v.dormName, rank:v.stats.rank, rankLabel:v.stats.rankLabel, avg:v.stats.avg, warn:v.stats.warn, createdAt:v.createdAt};
      });
      historyCache = metas;
      return metas;
    }
    const list = await storageAPI.list("meta:");
    if(!list || !list.keys){ historyCache = []; return historyCache; }
    const metas = [];
    for(const k of list.keys){
      try{
        const r = await storageAPI.get(k);
        if(r && r.value) metas.push(JSON.parse(r.value));
      }catch(e){}
    }
    metas.sort((a,b)=>b.createdAt-a.createdAt);
    historyCache = metas;
    return metas;
  }catch(e){
    console.error("history load error", e);
    historyCache = [];
    return historyCache;
  }
}

}

async function requestDelete(id){
  state.pendingDelete = id;
  render();
}
async function confirmDelete(){
  const id = state.pendingDelete;
  if(!id) return;
  try{
    if(cloudEnabled){
      await db.collection(AUDITS_COLLECTION).doc(id).delete();
    }else{
      await storageAPI.delete("audit:"+id);
      await storageAPI.delete("meta:"+id);
    }
    historyCache = null;
    state.pendingDelete = null;
    state.view = "history";
    render();
    await refreshHistoryView();
  }catch(e){
    console.error("delete error", e);
    toast("削除に失敗しました");
  }
}
function cancelDelete(){

}

let toastTimer = null;
function toast(msg){
  let el = document.getElementById("toastEl");
  if(!el){
    el = document.createElement("div");
    el.id = "toastEl";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 2200);
}

const RANK_HEX = {A:"1D5C3B", B:"1D4B78", C:"7A4B08", D:"B23A3A"};
const MARK_HEX = {good:"2F8F5B", ok:"2E6FB0", warn:"C2790E"};

function setPptxBusy(busy, msg){
  const btn = document.getElementById("pptxBtn");
  const note = document.getElementById("pptxNote");
  if(btn){ btn.disabled = busy; btn.style.opacity = busy? .6:1; }
  if(note) note.textContent = msg || "タップするとこの監査結果を .pptx ファイルとしてダウンロードします（英語・タガログ語で作成されます）";
}

async function exportPptx(){
  const record = currentRecord;
  if(!record){ toast("出力するデータがありません"); return; }
  if(typeof PptxGenJS === "undefined"){
    toast("PowerPoint機能の読み込みに失敗しました。インターネット接続をご確認ください");
    return;
  }
  setPptxBusy(true, "PowerPointを作成しています…");
  try{
    const pptx = new PptxGenJS();
    pptx.defineLayout({name:"WIDE", width:10, height:5.63});
    pptx.layout = "WIDE";
    const s = record.stats;
    const dormInfo = DORMS.find(d=>d.name===record.dormName) || {en:record.dormName, tl:record.dormName};
    const rankTr = RANK_TR[s.rank] || {en:s.rankLabel, tl:s.rankLabel};

    const title = pptx.addSlide();
    title.background = {color:"F6F4EF"};
    title.addText(PPTX_TXT.headerTitle, {x:0.5,y:0.3,w:9,h:0.45,fontSize:12,color:"5C6B63",bold:true});
    title.addText(dormInfo.en, {x:0.5,y:0.72,w:9,h:0.45,fontSize:26,bold:true,color:"173D34"});
    title.addText(dormInfo.tl, {x:0.5,y:1.15,w:9,h:0.35,fontSize:15,italic:true,color:"2B6659"});
    title.addText(`${PPTX_TXT.date}: ${record.date}      ${PPTX_TXT.inspector}: ${record.inspector}`, {x:0.5,y:1.6,w:9,h:0.4,fontSize:13,color:"5C6B63"});
    title.addText(`${rankTr.en} / ${rankTr.tl}  (${s.avg} / 100)`, {x:0.5,y:2.1,w:9,h:0.55,fontSize:22,bold:true,color:RANK_HEX[s.rank]||"20302A"});
    title.addText(
      `◎ ${RATE_DEF.good.en}/${RATE_DEF.good.tl}: ${s.good}    〇 ${RATE_DEF.ok.en}/${RATE_DEF.ok.tl}: ${s.ok}    △ ${RATE_DEF.warn.en}/${RATE_DEF.warn.tl}: ${s.warn}`,
      {x:0.5,y:2.7,w:9,h:0.55,fontSize:11.5,color:"20302A"});
    title.addText(`(${s.rated}/${s.total} ${PPTX_TXT.evaluated})`, {x:0.5,y:3.15,w:9,h:0.3,fontSize:10,color:"8A9791"});
    if(record.comment){
      title.addText(PPTX_TXT.overallComment, {x:0.5,y:3.55,w:9,h:0.35,fontSize:12,bold:true,color:"2B6659"});
      title.addText(record.comment, {x:0.5,y:3.9,w:9,h:1.5,fontSize:11,color:"20302A",valign:"top"});
    }

    const tableSlide = pptx.addSlide();
    tableSlide.addText(PPTX_TXT.itemList, {x:0.4,y:0.2,w:9.2,h:0.4,fontSize:15,bold:true,color:"173D34"});
    const rows = [[
      {text:PPTX_TXT.colNo, options:{bold:true, fill:{color:"E2EEE8"}, fontSize:8}},
      {text:PPTX_TXT.colItem, options:{bold:true, fill:{color:"E2EEE8"}, fontSize:8}},
      {text:PPTX_TXT.colRating, options:{bold:true, fill:{color:"E2EEE8"}, fontSize:8}}
    ]];
    record.items.forEach((it,i)=>{
      const markColor = it.rating? (MARK_HEX[it.rating]||"20302A") : "8A9791";
      const mark = it.rating? (it.rating==="good"?"◎":it.rating==="ok"?"〇":"△") : "-";
      rows.push([
        {text:String(i+1), options:{fontSize:8}},
        {text:`${it.en}\n${it.tl}`, options:{fontSize:8}},
        {text:mark, options:{fontSize:10, bold:true, color:markColor, align:"center"}}
      ]);
    });
    const half = Math.ceil(rows.length/2);
    const colA = [rows[0]].concat(rows.slice(1, half));
    const colB = [rows[0]].concat(rows.slice(half));
    tableSlide.addTable(colA, {x:0.4, y:0.68, w:4.5, colW:[0.4,3.3,0.8], fontSize:8, border:{type:"solid", color:"E4DFD3", pt:0.5}, autoPage:false});
    if(colB.length>1){
      tableSlide.addTable(colB, {x:5.1, y:0.68, w:4.5, colW:[0.4,3.3,0.8], fontSize:8, border:{type:"solid", color:"E4DFD3", pt:0.5}, autoPage:false});
    }
    tableSlide.addText(
      `◎ ${RATE_DEF.good.en}/${RATE_DEF.good.tl}   〇 ${RATE_DEF.ok.en}/${RATE_DEF.ok.tl}   △ ${RATE_DEF.warn.en}/${RATE_DEF.warn.tl}`,
      {x:0.4,y:5.15,w:9.2,h:0.35,fontSize:9,color:"8A9791"});

    const detailItems = record.items.filter(it => (it.photos && it.photos.length) || it.note || it.rating==="warn");
    detailItems.forEach(it=>{
      const slide = pptx.addSlide();
      const markColor = it.rating? (MARK_HEX[it.rating]||"20302A") : "8A9791";
      const ratingTr = it.rating? RATE_DEF[it.rating] : null;
      const mark = ratingTr? `${it.rating==="good"?"◎":it.rating==="ok"?"〇":"△"} ${ratingTr.en} / ${ratingTr.tl}` : PPTX_TXT.notEvaluated;
      slide.addText(it.en, {x:0.5,y:0.3,w:6.9,h:0.45,fontSize:19,bold:true,color:"20302A"});
      slide.addText(it.tl, {x:0.5,y:0.72,w:6.9,h:0.35,fontSize:13,italic:true,color:"2B6659"});
      slide.addText(mark, {x:7.5,y:0.3,w:2.0,h:0.7,fontSize:12,bold:true,color:markColor,align:"right",valign:"top"});
      let y = 1.25;
      if(it.note){
        slide.addText("Note (original / orihinal):", {x:0.5,y:y,w:9,h:0.3,fontSize:10,bold:true,color:"8A9791"});
        y += 0.32;
        slide.addText(it.note, {x:0.5,y:y,w:9,h:0.6,fontSize:12,color:"20302A",valign:"top"});
        y += 0.75;
      }
      const imgs = (it.photos||[]).slice(0,3);
      if(imgs.length){
        const gap=0.25, w=(9-(gap*(imgs.length-1)))/imgs.length, h=w*0.75;
        imgs.forEach((p,i)=>{
          try{ slide.addImage({data:p, x:0.5+i*(w+gap), y:y, w:w, h:h}); }catch(e){ console.error("image add error", e); }
        });
      } else if(!it.note){
        slide.addText(PPTX_TXT.noPhoto, {x:0.5,y:y,w:9,h:0.4,fontSize:12,color:"8A9791"});
      }
    });

    const fname = `DormAudit_${dormInfo.en.replace(/[^A-Za-z0-9]+/g,"")}_${record.date}`.replace(/[\\/:*?"<>|]/g,"") + ".pptx";
    await pptx.writeFile({fileName: fname});
    setPptxBusy(false);
    toast("PowerPointを保存しました");
  }catch(e){
    console.error("pptx export error", e);
    setPptxBusy(false, "作成に失敗しました。もう一度お試しください");
    toast("PowerPoint作成に失敗しました");
  }
}

    ${renderTabs()}
    ${body}
    ${renderConfirm()}
  `;

  if(state.view==="history") refreshHistoryView();
  if(state.view==="detail") loadDetailContent();
}

render();
</script>
</body>
</html>
